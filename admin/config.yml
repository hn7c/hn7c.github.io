# Replace YOUR_TURBO_SITE_ID with the UUID from your Decap Turbo site.
# Full instructions: DECAP_SETUP.md. No passwords or tokens belong here.
backend:
  name: turbo-github
  turbo_site_id: e38c2fbe-0ea8-4a4d-9526-17bf6c6e74a4
  branch: main
publish_mode: simple
media_folder: assets/uploads
public_folder: assets/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: work
  label: Work
  label_singular: Post
  description: Choose New Post to write. Entries named Your post title are manual-writing
    templates; do not edit them in the CMS.
  folder: content/posts/work
  create: true
  extension: md
  format: yaml-frontmatter
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{title}} — {{date}}'
  sortable_fields:
  - date
  - title
  editor:
    preview: false
  fields: &id001
  - label: Title
    name: title
    widget: string
  - label: Date
    name: date
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - label: Short description
    name: summary
    widget: text
    required: false
    default: ''
  - label: Keep off the public website
    name: draft
    widget: boolean
    default: true
    required: false
    hint: Turn this OFF when ready to publish. A public repository still exposes draft
      source files.
  - label: Post
    name: body
    widget: markdown
    hint: Start headings at level 2. For PDFs or slides, upload in Media and insert
      a link to assets/uploads/your-file.pdf.
